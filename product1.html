<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            width: 350px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .product-info {
            padding: 25px;
        }

        .product-name {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .price {
            color: #e63946;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quantity input {
            width: 60px;
            padding: 8px;
            text-align: center;
        }

        .add-cart {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .add-cart:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <!-- Product Image -->
        <img src="product.jpg" alt="Product Image" class="product-image">

        <div class="product-info">

            <!-- Product Name -->
            <h1 class="product-name">Premium Product</h1>

            <!-- Price -->
            <p class="price">₱499.00</p>

            <!-- Description -->
            <p class="description">
                This is a high-quality product perfect for everyday use.
                Durable, stylish, and affordable.
            </p>

            <!-- Quantity -->
            <div class="quantity">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" value="1" min="1">
            </div>

            <!-- Button -->
            <button class="add-cart" onclick="addToCart()">
                Add to Cart
            </button>

        </div>
    </div>

    <script>
        function addToCart() {
            let quantity = document.getElementById("quantity").value;

            alert("Product added to cart! Quantity: " + quantity);
        }
    </script>

</body>
</html>

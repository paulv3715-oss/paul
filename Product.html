<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Motor Parts Shop</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background: #f4f4f4; 
        }
        
        nav { 
            background: black; 
            padding: 18px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        
        nav a, nav button { 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 16px;
            font-family: inherit;
            padding: 8px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #ddd;
        }

        /* Red Logout Button */
        .logout-btn {
            background-color: #e74c3c !important;
            border-radius: 6px;
            padding: 8px 16px !important;
            margin-left: 15px;
        }

        .logout-btn:hover {
            background-color: #c0392b !important;
            color: white !important;
        }

        /* Page Container with Background Overlay */
        .products-page { 
            min-height: calc(100vh - 60px); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('images.jpg') no-repeat center center/cover;
            color: white; 
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Glassmorphism content box */
        .content-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 25px;
            border-radius: 12px;
            max-width: 1100px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .content-container h1 { 
            font-size: 38px; 
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 20px;
            color: #f1c40f;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* Cards Container Grid */
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Product Card Styling */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 210px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            font-size: 18px;
            margin: 5px 0;
            color: #ffffff;
        }

        .card p {
            font-size: 15px;
            color: #2ecc71;
            font-weight: bold;
            margin: 5px 0 15px 0;
        }

        .buy-btn {
            background: #27ae60;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s ease, transform 0.1s ease;
            width: 100%;
        }

        .buy-btn:hover {
            background: #219653;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <nav> 
        <a href="Home.html">Home</a>
        <a href="About.html">About</a>
        <a href="Product.html">Product</a>
        <a href="Contact.html">Contact</a>   
        <a href="Films.html">Videos</a>
        
        <!-- Logout button that returns to Login.html -->
        <button type="button" class="logout-btn" onclick="handleLogout()">Logout</button>
    </nav>

    <div class="products-page">
        <div class="content-container">
            <h1>??? Our Products</h1>
            <div class="subtitle">?? Buy Now ???</div>

            <div class="container">
                <div class="card">
                    <img src="pipe.jpg" alt="JVT Pipes">
                    <h2>JVT PIPES</h2>
                    <p>Price: ?3,000 - 6,000</p>
                    <button class="buy-btn">?? Buy Now</button>
                </div>

                <div class="card">
                    <img src="pulley set.jpg" alt="Pulley Set">
                    <h2>PULLEY SET</h2>
                    <p>Price: ?1,000 - 2,500</p>
                    <button class="buy-btn">?? Buy Now</button>
                </div>

                <div class="card">
                    <img src="mags.jpg" alt="14s Mags">
                    <h2>14s MAGS</h2>
                    <p>Price: ?3,500 - 5,000</p>
                    <button class="buy-btn">?? Buy Now</button>
                </div>

                <div class="card">
                    <img src="seat.jpg" alt="JRP Seat Assembly">
                    <h2>JRP SEAT ASSEMBLY</h2>
                    <p>Price: ?3,000</p>
                    <button class="buy-btn">?? Buy Now</button>
                </div>

                <div class="card">
                    <img src="block.jpg" alt="Pitsbike Block">
                    <h2>PITSBIKE BLOCK</h2>
                    <p>Price: ?1,500 - 2,500</p>
                    <button class="buy-btn">?? Buy Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogout() {
            // Redirects to Login.html on click
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
